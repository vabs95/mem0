name: mem0

services:
  mem0:
    build:
      context: "${MEM0_REPO_URL:-https://github.com/mem0ai/mem0.git}#${MEM0_REPO_REF:-main}"
      dockerfile: server/dev.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8000"
    networks:
      - mem0_network
    volumes:
      - ./history:/app/history
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      PYTHONUNBUFFERED: "1"

      AUTH_DISABLED: "${AUTH_DISABLED:-false}"
      JWT_SECRET: "${JWT_SECRET}"
      DASHBOARD_URL: "https://vabs-vps.oberhasli-prometheus.ts.net:3443"
      APP_DB_NAME: "mem0_app"
      MEM0_TELEMETRY: "${MEM0_TELEMETRY:-false}"

      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_COLLECTION_NAME: "${POSTGRES_COLLECTION_NAME:-memories}"

      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENROUTER_API_BASE: "${OPENROUTER_API_BASE:-https://openrouter.ai/api/v1}"

      MEM0_DEFAULT_LLM_MODEL: "${MEM0_DEFAULT_LLM_MODEL:-openai/gpt-4.1-mini}"
      MEM0_DEFAULT_EMBEDDER_MODEL: "${MEM0_DEFAULT_EMBEDDER_MODEL:-openai/text-embedding-3-small}"

      REQUEST_LOG_RETENTION_DAYS: "${REQUEST_LOG_RETENTION_DAYS:-30}"

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    shm_size: "128mb"
    networks:
      - mem0_network
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d ${POSTGRES_DB:-postgres} -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_db:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "127.0.0.1:8432:5432"

  mem0-dashboard:
    build:
      context: "${MEM0_REPO_URL:-https://github.com/mem0ai/mem0.git}#${MEM0_REPO_REF:-main}:server/dashboard"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - mem0_network
    environment:
      NEXT_PUBLIC_API_URL: "https://vabs-vps.oberhasli-prometheus.ts.net:8443"
      API_INTERNAL_URL: "http://mem0:8000"
      NEXT_PUBLIC_INSTANCE_NAME: "Mem0"
    depends_on:
      mem0:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mem0-mcp:
    build:
      context: "${MEM0_REPO_URL:-https://github.com/vabs95/mem0.git}#${MEM0_REPO_REF:-feat-self-hosted-mcp}:server/mcp"
    restart: unless-stopped
    ports:
      - "${MEM0_MCP_BIND:-127.0.0.1}:${MEM0_MCP_PORT:-8765}:8765"
    networks:
      - mem0_network
    environment:
      MEM0_API_URL: "${MEM0_API_URL:-http://mem0:8000}"
      MEM0_API_KEY: "${MEM0_API_KEY:-}"
      MEM0_DEFAULT_USER_ID: "${MEM0_DEFAULT_USER_ID:-mem0-mcp}"
      MEM0_DEFAULT_AGENT_ID: "${MEM0_DEFAULT_AGENT_ID:-}"
      HOST: "0.0.0.0"
      PORT: "8765"

volumes:
  postgres_db:

networks:
  mem0_network:
    driver: bridge
